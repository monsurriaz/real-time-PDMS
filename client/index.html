<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parcel Delivery</title>
    <!--
      An inline SVG favicon: the wordmark's rotated accent square. Without one
      the browser requests /favicon.ico and logs a 404, and the definition of
      done in CLAUDE.md section 10 says no console errors.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='8' y='8' width='16' height='16' rx='2' fill='%23EA4E1B' transform='rotate(45 16 16)'/%3E%3C/svg%3E"
    />
    <!-- Same three faces as the locked design reference: Manrope for UI,
         JetBrains Mono for every number, Montserrat for the wordmark only. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Montserrat:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
